version: '3.8'

# 在 scripts 目录执行时，使用 context: .. 指向项目根以便 Dockerfile 能 COPY src/
services:
  script-tristate-ttx-export:
    build:
      context: ..
      dockerfile: scripts/Dockerfile
    image: magecommerce-docker.pkg.coding.net/genispace/images/script-tristate-ttx-export:latest
    container_name: script-tristate-ttx-export
    
    # 优先从项目根 .env 加载（覆盖镜像中的默认值）
    env_file:
      - ../.env
    # 环境变量配置（与 .env.example 对齐，env_file 中的值会覆盖下面默认值）
    environment:
      - OUTPUT_DIR=/app/output
      - OUTPUT_FORMAT=dataSource
      - REPORT_TYPE=all
      - TTX_WAREHOUSE=HF
      - HEADLESS=true
      - PAGE_SIZE=500
      - TTX_NAVIGATION_TIMEOUT=60000
      - TTX_SYNC_STEP=all
      - BATCH_INSERT_SIZE=500
    
    # 挂载输出目录
    volumes:
      - ./output:/app/output
    
    # 网络配置
    # network_mode: host  # 如果需要访问宿主机网络，取消注释
    
    # 资源限制
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
